version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mongo_crimelab
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  neo4j:
    image: neo4j:latest
    container_name: neo4j_crimelab
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  mongo_data:
  neo4j_data:
  neo4j_logs:
